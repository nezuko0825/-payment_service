version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: payment-service-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - payment-network

  redis:
    image: redis:alpine
    container_name: payment-service-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - payment-network

  app:
    build: .
    container_name: payment-service-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/payment-service?authSource=admin
      REDIS_URL: redis://redis:6379
      SECRET_KEY: docker-secret-key
      WEBHOOK_TIMEOUT: 300000
      MAX_TIMESTAMP_DIFF: 300000
    depends_on:
      - mongodb
      - redis
    networks:
      - payment-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  payment-network:
    driver: bridge